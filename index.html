<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Suomen Sanasto — Finnish Vocabulary</title>
<meta name="description" content="Flashcards, quizzes and writing practice for Finnish A1.2 vocabulary." />
<meta name="theme-color" content="#E6EEC9" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="app" class="app"></div>

<div id="name-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h2>Welcome! 👋</h2>
    <p>What's your name? So if this gets shared with friends, your progress shows up correctly.</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="30" autocomplete="off" />
    <div class="modal-actions">
      <button id="name-skip" type="button" class="ghost-btn">Skip</button>
      <button id="name-submit" type="button" class="primary-btn">Start studying</button>
    </div>
  </div>
</div>

<template id="tpl-home">
  <header class="app-header">
    <h1>Suomen Sanasto</h1>
    <p class="subtitle">Finnish A1.2 vocabulary practice</p>
  </header>

  <section class="card panel">
    <h2 class="panel-title">Chapters</h2>
    <div class="chip-row" data-role="chapters"></div>
  </section>

  <section class="card panel">
    <h2 class="panel-title">Direction</h2>
    <div class="segmented" data-role="direction">
      <button class="segmented-btn" data-value="fi-en">FI → EN</button>
      <button class="segmented-btn" data-value="en-fi">EN → FI</button>
      <button class="segmented-btn" data-value="mixed">Mixed</button>
    </div>
  </section>

  <section class="card panel stats-panel" data-role="stats-summary"></section>

  <section class="mode-grid">
    <button class="mode-btn" data-mode="review">
      <span class="mode-emoji">⏰</span>
      <span class="mode-name">Review due</span>
      <span class="mode-desc" data-role="due-count">Smart review</span>
    </button>
    <button class="mode-btn" data-mode="flashcards">
      <span class="mode-emoji">🃏</span>
      <span class="mode-name">Flashcards</span>
      <span class="mode-desc">Flip &amp; self-grade</span>
    </button>
    <button class="mode-btn" data-mode="quiz">
      <span class="mode-emoji">🎯</span>
      <span class="mode-name">Quiz</span>
      <span class="mode-desc">Multiple choice</span>
    </button>
    <button class="mode-btn" data-mode="write">
      <span class="mode-emoji">⌨️</span>
      <span class="mode-name">Write</span>
      <span class="mode-desc">Type the answer</span>
    </button>
  </section>

  <div class="link-row">
    <button class="link-btn" data-role="stats-link">View progress by chapter →</button>
    <button class="link-btn" data-role="glossary-link">📖 Browse full glossary →</button>
  </div>

  <p class="app-credit">Created by LinhPham</p>
</template>

<template id="tpl-session">
  <header class="session-header">
    <button class="icon-btn" data-role="exit" aria-label="Back">←</button>
    <div class="session-progress">
      <div class="session-progress-bar"><div class="session-progress-fill" data-role="progress-fill"></div></div>
      <span class="session-progress-label" data-role="progress-label"></span>
    </div>
    <span class="session-score" data-role="score"></span>
  </header>
  <main class="session-body" data-role="body"></main>
</template>

<template id="tpl-flashcard">
  <div class="flashcard" data-role="flashcard">
    <div class="flashcard-inner" data-role="flashcard-inner">
      <div class="flashcard-face flashcard-front">
        <span class="flashcard-chapter" data-role="chapter"></span>
        <span class="flashcard-word" data-role="front"></span>
        <span class="flashcard-hint">tap to flip</span>
      </div>
      <div class="flashcard-face flashcard-back">
        <span class="flashcard-chapter" data-role="chapter-back"></span>
        <span class="flashcard-word" data-role="back"></span>
      </div>
    </div>
  </div>
  <div class="grade-row" data-role="grade-row" hidden>
    <button class="grade-btn grade-again" data-grade="again">Still learning</button>
    <button class="grade-btn grade-good" data-grade="good">Got it</button>
  </div>
</template>

<template id="tpl-quiz">
  <div class="prompt-card">
    <span class="prompt-chapter" data-role="chapter"></span>
    <span class="prompt-word" data-role="prompt"></span>
  </div>
  <div class="options-grid" data-role="options"></div>
  <div class="write-feedback" data-role="quiz-feedback" hidden></div>
  <button class="primary-btn" data-role="next" hidden>Next →</button>
</template>

<template id="tpl-write">
  <div class="prompt-card">
    <span class="prompt-chapter" data-role="chapter"></span>
    <span class="prompt-word" data-role="prompt"></span>
  </div>
  <form data-role="form" autocomplete="off">
    <input class="write-input" data-role="input" type="text" placeholder="Type the translation…" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <div class="hint-text" data-role="hint-text" hidden></div>
    <div class="write-actions">
      <button type="button" class="ghost-btn" data-role="hint">💡 Hint</button>
      <button type="submit" class="primary-btn" data-role="check">Check</button>
    </div>
  </form>
  <div class="write-feedback" data-role="feedback" hidden></div>
  <button class="primary-btn" data-role="next" hidden>Next →</button>
</template>

<template id="tpl-summary">
  <div class="summary-card">
    <h2 data-role="headline"></h2>
    <p data-role="detail"></p>
    <div class="summary-actions">
      <button class="ghost-btn" data-role="home">Home</button>
      <button class="primary-btn" data-role="again">Study again</button>
    </div>
  </div>
</template>

<template id="tpl-stats">
  <header class="session-header session-header--plain">
    <button class="icon-btn" data-role="exit" aria-label="Back">←</button>
    <h2>Progress</h2>
    <button class="icon-btn" data-role="reset" aria-label="Reset progress" title="Reset all progress">↺</button>
  </header>

  <section class="card badge-explainer">
    <div class="badge-explainer-row">
      <span class="badge-dot badge-dot--new"></span>
      <div>
        <strong>New</strong>
        <p>You haven't studied this word yet.</p>
      </div>
    </div>
    <div class="badge-explainer-row">
      <span class="badge-dot badge-dot--learning"></span>
      <div>
        <strong>Learning</strong>
        <p>You've started practicing it, but haven't gotten it right 5 times in a row yet.</p>
      </div>
    </div>
    <div class="badge-explainer-row">
      <span class="badge-dot badge-dot--mastered"></span>
      <div>
        <strong>Mastered 🏆</strong>
        <p>You got it right 5 times in a row!</p>
      </div>
    </div>
    <p class="badge-explainer-note">⚠️ Any wrong answer — or using a Hint — resets that streak back to 0, so it goes back to Learning.</p>
  </section>

  <main class="stats-body" data-role="body"></main>
</template>

<template id="tpl-glossary">
  <header class="session-header session-header--plain">
    <button class="icon-btn" data-role="exit" aria-label="Back">←</button>
    <h2>Full Glossary</h2>
    <span class="icon-btn-spacer" aria-hidden="true"></span>
  </header>
  <main class="glossary-body" data-role="body"></main>
</template>

<script src="js/config.js"></script>
<script src="js/srs.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
